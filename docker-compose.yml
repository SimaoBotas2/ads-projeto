services:
  postgres:
    image: postgres:15-alpine
    container_name: movie_recommendation_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movie_recommendation_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d movie_recommendation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: src/api
      dockerfile: Dockerfile
    container_name: movie_recommendation_api
    ports:
      - "5005:5005"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/movie_recommendation_db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      api-db-init:
        condition: service_completed_successfully
    volumes:
      - ./src/api:/app
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5005/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-db-init:
    build:
      context: src/api
      dockerfile: Dockerfile
    container_name: movie_recommendation_api_db_init
    command: >
      sh -c "
        alembic upgrade head
      "
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/movie_recommendation_db
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/api:/app

  web:
    build:
      context: src/web
      dockerfile: Dockerfile
    container_name: movie_recommendation_web
    ports:
      - "80:80"
    environment:
      API_URL: ${API_URL:-http://localhost:5005}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
