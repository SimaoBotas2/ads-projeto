generate_python_documentation_api:
  stage: documentation
  image: python:3.13
  variables:
    DOCS_MODE: "1"
  before_script:
    - pip install --upgrade pip
    - pip install -r ./src/api/requirements.txt
    - pip install pdoc
  script:
    - echo "Generating Python documentation for API"
    - mkdir -p public
    - pdoc --output-dir public ./src/api/app
  artifacts:
    paths:
      - public/

pages:
  stage: deploy
  dependencies:
    - generate_python_documentation_api
  script:
    - echo "Deploying documentation to GitLab Pages"
  artifacts:
    paths:
      - public/