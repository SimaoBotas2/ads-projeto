generate_python_documentation_api:
  stage: documentation
  image: python:3.13
  environment:
    DOCS_MODE: "1"
  before_script:
    - pip install --upgrade pip
    - pip install -r ./src/api/requirements.txt
    - pip install pdoc
  script:
    - echo "Generating Python documentation for API"
    - mkdir -p docs
    - pdoc --output-dir docs ./src/api/app
  artifacts:
    paths:
      - docs/