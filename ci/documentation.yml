generate_python_documentation_api:
  stage: documentation
  variables:
    DOCS_MODE: "1"
  before_script:
    - pip install --upgrade pip
    - pip install -r ./src/api/requirements.txt
    - pip install pdoc
  script:
    - echo "Generating Python documentation for API"
    - mkdir -p public/api
    - pdoc --output-dir public/api ./src/api/app
  artifacts:
    paths:
      - public/

generate_react_documentation_frontend:
  stage: documentation
  image:
    name: node:20
    pull_policy: if-not-present
  before_script:
    - npm install --prefix ./src/web
    - npm install --prefix ./src/web --save-dev typedoc
  script:
    - echo "Generating React documentation for Frontend"
    - cd ./src/web && npx typedoc --out ../../public/frontend --entryPointStrategy expand ./src
  artifacts:
    paths:
      - public/

generate_mkdocs_documentation:
  stage: documentation
  image: 
    name: python:3.13-slim
    pull_policy: if-not-present
  before_script:
    - pip install --upgrade pip
    - pip install mkdocs mkdocs-material mkdocstrings pymdown-extensions mkdocs-mermaid2-plugin
  script:
    - echo "Generating MkDocs documentation"
    - cd ./docs && mkdocs build
  artifacts:
    paths:
      - public/

# Deploy documentation to GitLab Pages (generated by LLM)
pages:
  stage: deploy
  dependencies:
    - generate_python_documentation_api
    - generate_react_documentation_frontend
    - generate_mkdocs_documentation
  script:
    - echo "Deploying documentation to GitLab Pages"
    - echo "Using MkDocs as the main documentation portal"
  artifacts:
    paths:
      - public/
