static_analysis_api_pylint:
  stage: static_analysis
  script: |
    pip install pylint
    cd src/api
    pip install -r requirements.txt
    pylint $(find . -name "*.py") | tee pylint-report.txt
  artifacts:
    when: always
    paths:
      - src/api/pylint-report.txt
    expire_in: 1 week
  allow_failure: true
  # artifacts removidos pois pylint não gera arquivos por padrão

static_analysis_web_prettier:
  image: 
    name: node:20
    pull_policy: if-not-present
  stage: static_analysis
  script:
    - npm install -g prettier
    - cd src/web
    - prettier --check "**/*.{js,jsx,ts,tsx,css,scss,html,json,md}" | tee prettier-report.txt
  allow_failure: true
  artifacts:
    when: always
    paths:
      - src/web/prettier-report.txt
    expire_in: 1 week