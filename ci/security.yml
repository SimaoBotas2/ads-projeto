#https://github.com/aquasecurity/trivy/blob/main/contrib/Trivy.gitlab-ci.yml
Trivy_container_scanning:
  stage: security
  image:
    name: alpine:3.20
  parallel:
    matrix:
      - IMAGE_NAME: api
      - IMAGE_NAME: web
  variables:
    GIT_STRATEGY: none
    TRIVY_VERSION: "0.58.0"
  allow_failure: false
  before_script:
    - apk add --no-cache curl docker-cli
    - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${TRIVY_VERSION}
    - trivy registry login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - echo "Scanning image - $IMAGE_NAME"
    - mkdir -p security_reports
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --cache-dir .trivycache/ --no-progress --format json -o security_reports/${IMAGE_NAME}.json $CI_REGISTRY_IMAGE/${IMAGE_NAME}:latest
  cache:
    paths:
      - .trivycache/
  artifacts:
    reports:
      container_scanning: security_reports/${IMAGE_NAME}.json
    paths:
      - security_reports/
    when: always
  dependencies: []