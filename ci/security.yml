container_scanning:
  stage: security
  image: docker.io/aquasec/trivy:latest
  parallel:
    matrix:
      - IMAGE_NAME: api
      - IMAGE_NAME: web
  variables:
    GIT_STRATEGY: none
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    FULL_IMAGE_NAME: $CI_REGISTRY_IMAGE/${IMAGE_NAME}:latest
  script:
    # Check Trivy version
    - trivy --version

    # Login to the registry (optional but required for private images)
    - trivy registry login --username "$TRIVY_USERNAME" --password "$TRIVY_PASSWORD" "$TRIVY_AUTH_URL"

    # Update the vulnerability database
    - trivy image --download-db-only

    # Generate a GitLab-specific JSON report
    - trivy image --exit-code 0 --format template --template "@/contrib/gitlab.tpl" \
        --output "$CI_PROJECT_DIR/gl-container-scanning-${IMAGE_NAME}.json" "$FULL_IMAGE_NAME"

    # Display the full report in the console
    - trivy image --exit-code 0 "$FULL_IMAGE_NAME"

    # Fail the job only if CRITICAL vulnerabilities are found
    - trivy image --exit-code 1 --severity CRITICAL "$FULL_IMAGE_NAME"
  cache:
    paths:
      - .trivycache/
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-${IMAGE_NAME}.json
