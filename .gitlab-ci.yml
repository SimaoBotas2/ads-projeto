default:
  image: 
    name: python:3.13-slim
    pull_policy: if-not-present
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # only for test CI/CD pipeline on CI/CD pipeline branch
    - if: $CI_COMMIT_BRANCH == "main"
    

stages:
  - static_analysis
  - unit_test
  - security
  - build
  - documentation
  - deploy

include:
  - local: '/ci/static_analysis.yml'
  - local: '/ci/unit_test.yml'
  - local: '/ci/security.yml'
  - local: '/ci/build.yml'
  - local: '/ci/documentation.yml'
  - local: '/ci/deploy.yml'

cache:
  key: ${CI_PROJECT_ID}-pip
  paths:
    - .cache/pip/